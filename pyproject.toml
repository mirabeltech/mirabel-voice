[project]
name = "mirabel-voice"
version = "0.6.0"
description = "Push-to-talk dictation for Windows. Hold a key, speak, and the text appears in any program."
requires-python = ">=3.10"
dependencies = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    "openai>=1.40",
    "anthropic>=0.40",
    "pynput>=1.7.7",
    "pystray>=0.19.5",
    "pillow>=10.0",
    "pyperclip>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "boto3>=1.34"]

[project.scripts]
mirabel-voice = "mirabel_voice.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mirabel_voice = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
