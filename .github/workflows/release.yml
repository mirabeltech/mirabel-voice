name: Verify Windows Python bundle
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Decides whether the slow jobs run. Pushes, tags and manual runs always do.
  # A pull request skips them only when every file it changes is docs-only:
  # an added or modified *.md file outside the code folders, or anything
  # under docs/images/. Everything else counts as code, including deletions
  # and renames (packaging copies README.md, ADMIN.md and three docs/*.md
  # guides into the ZIP) and docs/pricing.json (tests read it).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          code=true
          # On pull_request, HEAD is GitHub's merge commit: HEAD^1 is the base
          # and the diff is exactly what merging would change.
          if [ "$EVENT" = pull_request ] && git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            code=false
            while IFS=$'\t' read -r status path; do
              kind=code
              if [ "$status" = A ] || [ "$status" = M ]; then
                case "$path" in
                  src/*|tests/*|scripts/*|packaging/*|operations/*|.github/*|.claude/*) ;;
                  *.md|docs/images/*) kind=docs ;;
                esac
              fi
              echo "$kind  $status  $path"
              if [ "$kind" = code ]; then code=true; fi
            done < <(git diff --name-status --no-renames 'HEAD^1' HEAD)
          fi
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: **$code**" >> "$GITHUB_STEP_SUMMARY"
  bundle:
    needs: changes
    # Skips only on an explicit 'false'. If changes fails, the output is
    # empty and everything runs in full.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
          architecture: x64
      - name: Prepare build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install --require-hashes --no-deps -r packaging/requirements-build.lock
          .venv/Scripts/python.exe -m pip install --require-hashes --no-deps -r packaging/requirements-windows.lock
          .venv/Scripts/python.exe -m pip install --no-deps --no-build-isolation -e .
      - name: Check tag matches source
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (.venv/Scripts/python.exe packaging/prepare.py).Trim()
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag does not match source version' }
      - name: Build and test the actual ZIP with dummy configuration
        shell: powershell
        run: packaging/build_bundle.ps1 -RelayUrl https://relay.invalid -GoogleClientId ci-invalid -GoogleClientSecret ci-invalid
      - name: Verify installation, repair and interrupted-update recovery
        shell: powershell
        run: |
          $zip = Get-ChildItem dist/MirabelVoice-*-python.zip | Select-Object -First 1
          scripts/verify_bundle.ps1 -Bundle $zip.FullName
      - name: Audit the locked dependencies
        run: |
          .venv/Scripts/python.exe -m pip_audit -r packaging/requirements-windows.lock --require-hashes --disable-pip
          .venv/Scripts/python.exe -m pip_audit -r packaging/requirements-build.lock --require-hashes --disable-pip
      - name: Keep test artifact and inventories (no production configuration)
        uses: actions/upload-artifact@v4
        with:
          name: python-bundle-test-only
          path: |
            dist/MirabelVoice-*-python.zip*
            dist/*inventory.json
          if-no-files-found: error
  hardware:
    needs: [changes, bundle]
    # Branch protection requires each leg by its matrix name. A job-level
    # if: that is false skips the matrix before it expands and reports one
    # plain `hardware` check, so the required names never arrive (run
    # 41954561754). So the legs start whenever bundle passed or was skipped
    # for a docs-only pull request. On a docs-only pull request each leg runs
    # on Ubuntu, skips every real step, and passes in a few seconds.
    if: >-
      ${{ !cancelled() && (needs.bundle.result == 'success' ||
      (needs.bundle.result == 'skipped' && needs.changes.outputs.code == 'false')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ARM runs the x64 bundle under emulation; x64 shows what a runner can do.
          - runner: windows-11-arm
            cpu: ARM64
          - runner: windows-latest
            cpu: AMD64
    runs-on: ${{ needs.changes.outputs.code == 'false' && 'ubuntu-latest' || matrix.runner }}
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - name: Skip, no code changed
        if: env.CODE == 'false'
        run: echo "Docs-only pull request; the bundle was not built, so there is nothing to check on ${{ matrix.cpu }}."
      - uses: actions/checkout@v4
        if: env.CODE != 'false'
      - uses: actions/download-artifact@v4
        if: env.CODE != 'false'
        with:
          name: python-bundle-test-only
          path: dist
      - name: Verify installation, repair and recovery on this CPU
        if: env.CODE != 'false'
        shell: powershell
        run: |
          $zip = Get-ChildItem dist/MirabelVoice-*-python.zip | Select-Object -First 1
          scripts/verify_bundle.ps1 -Bundle $zip.FullName
      - name: Check the shortcut, injection and native libraries on this CPU
        if: ${{ !cancelled() && env.CODE != 'false' }}
        shell: powershell
        run: |
          $zip = Get-ChildItem dist/MirabelVoice-*-python.zip | Select-Object -First 1
          $unpacked = Join-Path $env:RUNNER_TEMP 'mv'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $unpacked
          & (Join-Path $unpacked 'python\python.exe') scripts/check_bundle_hardware.py --cpu ${{ matrix.cpu }}
          if ($LASTEXITCODE -ne 0) { throw 'Hardware checks failed' }
